<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05060a">
    <title>Cadastrar música · Minhas Músicas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="ipod.css">
    <link rel="stylesheet" href="cadastrar.css">
</head>
<body>
    <div class="ambiente" aria-hidden="true">
        <span class="luz luz-1"></span>
        <span class="luz luz-2"></span>
        <span class="grade"></span>
    </div>

    <header class="topo">
        <a class="voltar" href="index.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            Voltar para a lista
        </a>
        <span class="marca-mini" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </header>

    <main class="layout">
        <section class="painel" id="painel">
            <p class="sobretitulo">Nova faixa</p>
            <h1>Cadastrar música</h1>
            <p class="descricao">Comece pelo título e escolha uma sugestão do iTunes: artista, gênero, ano e duração são preenchidos sozinhos.</p>

            <div class="campos">
                <div class="campo campo-largo">
                    <label for="titulo">Título</label>
                    <div class="busca-itunes">
                        <input type="text" id="titulo" placeholder="Ex.: Garota de Ipanema" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sugestoes" aria-describedby="erro-titulo">
                        <span class="busca-itunes-status" aria-hidden="true"><span class="spinner"></span></span>
                        <ul class="sugestoes" id="sugestoes" role="listbox" aria-label="Sugestões do iTunes" hidden></ul>
                    </div>
                    <span class="erro-campo" id="erro-titulo"></span>
                </div>

                <div class="campo campo-largo">
                    <label for="artista">Artista</label>
                    <input type="text" id="artista" placeholder="Ex.: Tom Jobim" autocomplete="off" aria-describedby="erro-artista">
                    <span class="erro-campo" id="erro-artista"></span>
                </div>

                <div class="campo campo-genero">
                    <label for="genero">Gênero</label>
                    <input type="text" id="genero" placeholder="Ex.: Bossa Nova" autocomplete="off" aria-describedby="erro-genero">
                    <span class="erro-campo" id="erro-genero"></span>
                </div>

                <div class="campo campo-numero">
                    <label for="ano">Ano</label>
                    <input type="number" id="ano" placeholder="1962" inputmode="numeric" aria-describedby="erro-ano">
                    <span class="erro-campo" id="erro-ano"></span>
                </div>

                <div class="campo campo-numero">
                    <label for="duracao">Duração em minutos</label>
                    <div class="com-sufixo">
                        <input type="number" id="duracao" placeholder="3" inputmode="numeric" aria-describedby="erro-duracao">
                        <span aria-hidden="true">min</span>
                    </div>
                    <span class="erro-campo" id="erro-duracao"></span>
                </div>
            </div>

            <button class="botao-primario" id="botaoCadastrar">
                <span class="rotulo">Cadastrar</span>
                <span class="spinner" aria-hidden="true"></span>
            </button>
        </section>

        <aside class="previa" aria-label="Prévia da música">
            <p class="previa-rotulo">Prévia</p>
            <div class="previa-cartao" id="previa">
                <div class="previa-aparelho" id="previaAparelho"></div>
                <div class="previa-info">
                    <p class="previa-audio-titulo">Prévia do iTunes · 30s</p>
                    <p class="previa-audio-status" id="previaStatus" aria-live="polite">Digite o título para buscar</p>
                </div>
            </div>
        </aside>
    </main>

    <div class="toasts" id="toasts"></div>

    <script src="itunes.js"></script>
    <script src="ipod.js"></script>
    <script src="batida.js"></script>
    <script src="formulario.js"></script>
    <script src="cadastrar.js"></script>
</body>
</html>
